# Copy to config.yaml and edit. Run: clipstack -c config.yaml
url: "https://www.youtube.com/watch?v=XXXXXXXXXXX"
out_dir: "clips"
# cookies: "cookies.txt"      # optional, for videos that need a login

captions: true
model: "base.en"              # tiny.en | base.en | small.en | medium.en | large-v3 ...
words_per_caption: 3
font: "DejaVu Sans"
font_size: 74

top_height: 860               # px of the 1080x1920 output used by the face section

# Crop boxes are fractions (0-1) of the source frame. Use --preview to tune them.
facecam: { x: 0.00, y: 0.40, w: 0.20, h: 0.25 }
game:    { x: 0.21, y: 0.00, w: 0.57, h: 1.00 }

clips:
  - { start: "00:04:34", end: "00:05:04", name: "funny_moment" }
  - { start: "00:12:10", end: "00:12:40", name: "clutch_play" }
